<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account access | Bureau Portal</title><style>body{font-family:Arial,sans-serif;background:#eef6ff;color:#172033;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}main{background:#fff;padding:28px;max-width:420px;width:100%;border:1px solid #dbeafe;border-radius:12px;box-shadow:0 18px 50px #0d47a122}h1{color:#0d47a1}label{display:block;font-weight:700;margin:14px 0 6px}input,button{width:100%;box-sizing:border-box;padding:12px;border:1px solid #bfdbfe;border-radius:7px;font:inherit}button{margin-top:18px;background:#0d47a1;color:#fff;font-weight:700;cursor:pointer}a{color:#0d47a1}#message{min-height:24px;margin-top:14px}</style></head><body><main><img src="/assets/Bureau%20logo.png" alt="Bureau logo" width="56"><h1>Sign in</h1><p>Access your Bureau Portal dashboard.</p><form id="form"><label for="email">Email</label><input id="email" type="email" required autocomplete="username"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"><button>Sign in</button></form><p id="message" role="alert"></p><p><a href="/forgot-password.html">Forgot password?</a> · <a href="/">Return home</a></p></main><script>form.addEventListener('submit',async e=>{e.preventDefault();message.textContent='Signing in...';const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const x=await r.json();if(!r.ok){message.textContent=x.message;return}location.href=x.user.role==='employer'?'/employer-dashboard.html':x.user.role==='job-seeker'?'/job-seeker-dashboard.html':'/admin.html'});</script></body></html>
