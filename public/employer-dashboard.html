<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employer dashboard | Bureau Portal</title><link rel="stylesheet" href="/bureau-theme.css"><script src="/bureau-theme.js" defer></script><style>body{font-family:Arial;margin:0;background:#f3f8ff;color:#172033}header{background:#0d47a1;color:#fff;padding:22px}main{max-width:1000px;margin:24px auto;padding:0 18px}.panel{background:#fff;border:1px solid #dbeafe;border-radius:10px;padding:18px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}input,textarea,button{width:100%;box-sizing:border-box;padding:11px;font:inherit;border:1px solid #bfdbfe;border-radius:6px}textarea{min-height:90px}button{background:#0d47a1;color:#fff;font-weight:700}#message{color:#166534}.row{border-top:1px solid #dbeafe;padding:12px 0}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><img src="/assets/Bureau%20logo.png" alt="Bureau logo" style="height:30px;width:auto;vertical-align:middle;margin-right:10px"><strong>Employer dashboard</strong> <button id="logout">Sign out</button></header><main><p id="message"></p><section class="panel"><h1>Post a job</h1><form id="jobForm"><div class="grid"><input id="title" placeholder="Job title" required><input id="district" placeholder="District" required><input id="skills" placeholder="Skills required" required><input id="employmentType" value="Full-time" placeholder="Employment type" required></div><textarea id="description" placeholder="Job description" required></textarea><button>Publish job</button></form></section><section class="panel"><h2>My jobs</h2><div id="jobs"></div></section><section class="panel"><h2>Applications</h2><div id="applications"></div></section></main><script>const message=document.getElementById('message');async function load(){const r=await fetch('/api/dashboard/employer');if(!r.ok){location.href='/account.html';return}const x=await r.json();jobs.innerHTML=(x.jobs||[]).map(j=>`<div class="row"><strong>${j.title}</strong> · ${j.district} · ${j.status}</div>`).join('')||'<p>No jobs yet.</p>';applications.innerHTML=(x.applications||[]).map(a=>`<div class="row">${a.title} · ${a.job_seeker_id} · ${a.status}</div>`).join('')||'<p>No applications yet.</p>'}jobForm.addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title.value,description:description.value,district:district.value,skills:skills.value,employmentType:employmentType.value})});message.textContent=(await r.json()).message||'Job published';jobForm.reset();load()});logout.onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='/account.html'};load();</script></body></html>
