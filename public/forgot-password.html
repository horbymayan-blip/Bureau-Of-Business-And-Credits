<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password recovery | Bureau Portal</title><style>body{font-family:Arial;background:#eef6ff;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px}main{background:#fff;padding:28px;max-width:420px;width:100%;border:1px solid #dbeafe;border-radius:12px}label{display:block;font-weight:700;margin:16px 0 6px}input,button{width:100%;box-sizing:border-box;padding:12px;font:inherit;border:1px solid #bfdbfe;border-radius:7px}button{margin-top:18px;background:#0d47a1;color:white;font-weight:700}#message{min-height:24px}</style></head><body><main><img src="/assets/Bureau%20logo.png" alt="Bureau logo" width="56" style="display:block;margin-bottom:14px"><h1>Reset your password</h1><p>Enter your account email and we will send reset instructions.</p><form id="form"><label for="email">Email</label><input id="email" type="email" required><button>Request reset</button></form><p id="message" role="status"></p><a href="/account.html">Back to sign in</a></main><script>form.addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value})});message.textContent=(await r.json()).message});</script></body></html>
