<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job seeker dashboard | Bureau Portal</title><link rel="stylesheet" href="/bureau-theme.css"><script src="/bureau-theme.js" defer></script><style>body{font-family:Arial;margin:0;background:#f3f8ff;color:#172033}header{background:#0d47a1;color:#fff;padding:22px}main{max-width:1000px;margin:24px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.panel{background:#fff;border:1px solid #dbeafe;border-radius:10px;padding:18px}.job{border-top:1px solid #dbeafe;padding:14px 0}.job:first-child{border-top:0}button{padding:10px 14px;background:#0d47a1;color:#fff;border:0;border-radius:6px;font-weight:700}#message{color:#b91c1c}</style></head><body><header><img src="/assets/Bureau%20logo.png" alt="Bureau logo" style="height:30px;width:auto;vertical-align:middle;margin-right:10px"><strong>Job seeker dashboard</strong> <button id="logout">Sign out</button></header><main><p id="message"></p><section class="panel"><h1>Recommended opportunities</h1><div id="matches"></div></section><section class="panel"><h2>My applications</h2><div id="applications"></div></section></main><script>const message=document.getElementById('message');async function load(){const r=await fetch('/api/dashboard/job-seeker');if(!r.ok){location.href='/account.html';return}const x=await r.json();matches.innerHTML=(x.matches||[]).map(m=>`<article class="job"><strong>${m.job.title}</strong><div>${m.job.district} · ${m.score}% match</div><small>${(m.reasons||[]).join(' · ')}</small><br><button onclick="apply('${m.job.id}')">Apply</button></article>`).join('')||'<p>No matches yet.</p>';applications.innerHTML=(x.applications||[]).map(a=>`<div class="job">${a.job_id} · ${a.status}</div>`).join('')||'<p>No applications yet.</p>'}async function apply(id){const note=prompt('Add a short cover note');if(!note)return;const r=await fetch('/api/jobs/'+id+'/applications',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({coverNote:note})});message.textContent=(await r.json()).message||'Application sent';load()}logout.onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='/account.html'};load();</script></body></html>
