<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | Bureau Portal</title><link rel="stylesheet" href="/bureau-theme.css"><script src="/bureau-theme.js" defer></script>
  <style>
    :root { --blue: #0d47a1; --ink: #172033; --muted: #64748b; --line: #dbeafe; --bg: #f3f8ff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: var(--ink); font-family: Arial, sans-serif; background: linear-gradient(135deg, #eef6ff, #e0f2fe 45%, #f8fbff); }
    main { width: min(100%, 420px); background: white; border: 1px solid var(--line); border-radius: 12px; padding: 32px; box-shadow: 0 18px 50px rgba(13, 71, 161, 0.14); }
    img { width: 58px; height: 58px; margin-bottom: 18px; }
    h1 { margin: 0 0 8px; color: var(--blue); font-size: 1.7rem; }
    p { margin: 0 0 24px; color: var(--muted); }
    label { display: block; margin: 16px 0 7px; font-weight: 700; }
    input { width: 100%; padding: 12px 13px; border: 1px solid #bfdbfe; border-radius: 7px; font: inherit; }
    input:focus { outline: 3px solid rgba(37, 99, 235, 0.2); border-color: #2563eb; }
    button { width: 100%; margin-top: 22px; padding: 13px; border: 0; border-radius: 7px; background: var(--blue); color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: 0.65; cursor: wait; }
    #message { min-height: 24px; margin-top: 16px; color: #b91c1c; }
    a { color: var(--blue); }
  </style>
</head>
<body>
  <main>
    <img src="/assets/Bureau%20logo.png" alt="Bureau of Business and Credit logo" />
    <h1>Admin sign in</h1>
    <p>Access the Bureau Portal operations dashboard.</p>
    <form id="loginForm">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="username" required />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required minlength="12" />
      <button type="submit">Sign in</button>
      <div id="message" role="alert" aria-live="polite"></div>
    </form>
    <a href="/">Return to portal</a>
  </main>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector('button');
      const message = document.getElementById('message');
      button.disabled = true;
      message.textContent = '';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: form.email.value, password: form.password.value })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'Sign in failed.');
        window.location.href = '/premium';
      } catch (error) {
        message.textContent = error.message;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
