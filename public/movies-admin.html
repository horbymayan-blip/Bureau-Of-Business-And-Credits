<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movie Manager - BureauMovies</title><link rel="stylesheet" href="/bureau-theme.css"><script src="/bureau-theme.js" defer></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#0f172a;color:#e2e8f0}.top{background:#0d47a1;color:#fff;padding:16px 20px;display:flex;gap:14px;align-items:center}.top a{color:#fff;font-weight:700;text-decoration:none}.w{max-width:1020px;margin:0 auto;padding:20px}.card{background:#fff;color:#0f172a;border-radius:14px;padding:18px;margin:14px 0}input,select,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #cbd5e1;margin:5px 0}textarea{min-height:70px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.go{background:#e50914;border:0;color:#fff;font-weight:800;border-radius:8px;padding:12px 16px;cursor:pointer}.list{display:grid;gap:10px}.m{border:1px solid #e2e8f0;border-radius:10px;padding:12px;display:flex;gap:12px;align-items:center}.m img{width:64px;height:96px;object-fit:cover;border-radius:8px;background:#000}.pill{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:#eee}.pill.p{background:linear-gradient(135deg,#ff2a54,#ff5e3a);color:#fff}.small{font-size:12px;color:#64748b}</style></head><body><div class="top"><a href="/admin.html">Admin</a><b>Movie Manager</b><span style="flex:1"></span><a href="/movies">View BureauMovies</a></div><div class="w"><div class="card"><h2 style="margin:0 0 6px">Upload + Publish</h2><div class="small">1) Upload video/poster, 2) URLs auto-fill, 3) Publish. Featured + Premium = 10s billboard teaser.</div><p id="storageMsg" class="small" role="status">Checking upload storage…</p><div class="row"><div><label>Video file (.mp4/.webm/.mov/.mkv)</label><input type="file" id="fVideo" accept="video/*"><button class="go" id="uVideo" type="button">Upload Video</button></div><div><label>Poster (.jpg/.png/.webp)</label><input type="file" id="fPoster" accept="image/*"><button class="go" id="uPoster" type="button">Upload Poster</button></div></div><p id="upMsg" class="small"></p><div class="row"><div><label>Title</label><input id="title" placeholder="e.g. Kampala Nights"></div><div><label>Category / Genres</label><input id="genres" placeholder="Trending Now, Drama"></div></div><div class="row"><div><label>Year</label><input id="year" type="number" value="2026"></div><div><label>Runtime</label><input id="runtime" value="1h 45m"></div></div><label>Description</label><textarea id="desc" placeholder="Storyline..."></textarea><div class="row"><div><label>Access</label><select id="access"><option value="free">Free</option><option value="premium" selected>Premium (VIP)</option></select></div><div><label>Status</label><select id="status"><option value="published" selected>Published</option><option value="draft">Draft</option></select></div></div><div class="row"><div><label>Featured (billboard teaser)</label><select id="featured"><option value="yes" selected>Yes</option><option value="no">No</option></select></div><div><label>Subtitles lang</label><input id="subLang" value="en"></div></div><label>Media URL</label><input id="mediaUrl" placeholder="/assets/movies/...mp4 or https://..."><label>Poster URL</label><input id="posterUrl" placeholder="/assets/movies/...jpg"><button class="go" id="publish" type="button">Publish Movie</button><p id="msg" class="small"></p></div><div class="card"><h2 style="margin:0 0 8px">Catalog (<span id="count">0</span>)</h2><div class="list" id="list"></div></div></div>
<script>(function(){var T=function(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};async function up(file,type){var m=document.getElementById('upMsg');m.textContent='Uploading '+type+'...';var r=await fetch('/api/admin/movies/media?type='+type,{method:'POST',headers:{'X-Movie-Filename':file.name,'Content-Type':'application/octet-stream'},body:file});var j=await r.json();if(!r.ok){m.textContent=j.message||'Upload failed';return null}m.textContent='Uploaded: '+j.assetUrl;return j.assetUrl}document.getElementById('uVideo').onclick=async function(){var f=document.getElementById('fVideo').files[0];if(!f)return alert('Pick video');var u=await up(f,'media');if(u)document.getElementById('mediaUrl').value=u};document.getElementById('uPoster').onclick=async function(){var f=document.getElementById('fPoster').files[0];if(!f)return alert('Pick poster');var u=await up(f,'poster');if(u)document.getElementById('posterUrl').value=u};document.getElementById('publish').onclick=async function(){var m=document.getElementById('msg');var b={title:document.getElementById('title').value,year:Number(document.getElementById('year').value),runtime:document.getElementById('runtime').value,description:document.getElementById('desc').value,genres:document.getElementById('genres').value,access:document.getElementById('access').value,status:document.getElementById('status').value,featured:document.getElementById('featured').value,subtitlesLanguage:document.getElementById('subLang').value,mediaUrl:document.getElementById('mediaUrl').value,posterUrl:document.getElementById('posterUrl').value||null};var r=await fetch('/api/admin/movies',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});var j=await r.json();m.textContent=j.message||(j.success?'Published.':'Failed');if(r.ok)load()};window.delM=async function(id){if(!confirm('Delete?'))return;await fetch('/api/admin/movies/'+encodeURIComponent(id),{method:'DELETE'});load()};window.togF=async function(id,cur){await fetch('/api/admin/movies/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({featured:!cur})});load()};window.togA=async function(id,cur){await fetch('/api/admin/movies/'+encodeURIComponent(id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({access:cur==='premium'?'free':'premium'})});load()};async function load(){var r=await fetch('/api/admin/movies');if(r.status===401||r.status===403){location.href='/account.html';return}var j=await r.json();var L=j.movies||[];document.getElementById('count').textContent=L.length;document.getElementById('list').innerHTML=L.map(function(x){return '<div class="m"><img src="'+T(x.posterUrl||'/assets/alternative.jpg')+'"><div style="flex:1"><b>'+T(x.title)+'</b> <span class="pill '+(x.access==='premium'?'p':'')+'">'+T(x.access)+'</span> <span class="pill">'+T(x.status)+'</span> '+(x.featured?'<span class="pill p">FEATURED</span>':'')+'<div class="small">'+T(x.id)+' - '+T(x.genres||'')+' - '+T(x.mediaUrl||'')+'</div><div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><button onclick="togF(\''+x.id+'\','+(x.featured?'true':'false')+')">'+(x.featured?'Unfeature':'Feature')+'</button><button onclick="togA(\''+x.id+'\',\''+x.access+'\')">Make '+(x.access==='premium'?'Free':'Premium')+'</button><button onclick="delM(\''+x.id+'\')">Delete</button><a href="/play.html?mId='+encodeURIComponent(x.id)+'">Play</a></div></div></div>'}).join('')||'No movies yet.'}load()})();</script></body></html>
<script>(function(){var FB='/assets/movie-poster-fallback.svg';function fix(){try{var list=document.getElementById('list');if(!list)return;var imgs=list.querySelectorAll('.m img');for(var i=0;i<imgs.length;i++){var im=imgs[i];var s=im.getAttribute('src');if(!s){im.src=FB;}else if(!im.dataset.bmfb){im.onerror=(function(el){return function(){el.onerror=null;el.src=FB;};})(im);}}}catch(e){}}document.addEventListener('DOMContentLoaded',function(){fix();var list=document.getElementById('list');if(list&&window.MutationObserver){new MutationObserver(fix).observe(list,{childList:true,subtree:true});}setInterval(fix,3000);});})();</script>
<script>(function(){async function storage(){var el=document.getElementById('storageMsg');if(!el)return;try{var r=await fetch('/api/admin/movies/storage');var j=await r.json();if(!r.ok)throw new Error();el.textContent='Upload folder: '+j.fileCount+' file(s), '+j.totalMb+' MB in public/assets/movies. OneDrive syncs this — keep 2x the video size free.';}catch(e){el.textContent='Could not read upload storage. If uploads fail, check OneDrive space.';}}document.addEventListener('DOMContentLoaded',storage);})();</script>
