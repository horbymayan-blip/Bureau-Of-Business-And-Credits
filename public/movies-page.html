<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BureauMovies VIP - Plans</title><link rel="stylesheet" href="/bureau-theme.css"><script src="/bureau-theme.js" defer></script><style>*{box-sizing:border-box}body{margin:0;background:#141414;color:#fff;font-family:Inter,system-ui,Arial,sans-serif}.w{max-width:860px;margin:0 auto;padding:28px 18px 60px}h1{font-size:32px}.tabs{display:flex;gap:8px;margin:16px 0}.tabs button{flex:1;padding:12px;border-radius:8px;border:1px solid #333;background:#1d1d1d;color:#fff;font-weight:800;cursor:pointer}.tabs button.on{background:#e50914;border-color:#e50914}.card{background:#1c1c1c;border:1px solid #2b2b2b;border-radius:14px;padding:18px;margin-top:12px}input,select{width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#0f0f0f;color:#fff;margin:6px 0}.go{background:#e50914;border:0;color:#fff;font-weight:800;border-radius:8px;padding:12px 18px;cursor:pointer;width:100%}.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.plan{border:1px solid #333;border-radius:10px;padding:12px;text-align:center;cursor:pointer}.plan.on{border-color:#e50914;background:#261112}a{color:#ffb3b3}</style></head><body><div class="w"><a href="/movies" style="color:#fff">← BureauMovies</a><h1>VIP Plans</h1><p style="color:#bcbcbc">Unlock premium premieres. MTN MoMo, Airtel Money, Card or Voucher.</p><div class="plans" id="plans"><div class="plan on" data-plan="1_day" data-amt="1000"><b>1 Day</b><div>UGX 1,000</div></div><div class="plan" data-plan="1_week" data-amt="5000"><b>1 Week</b><div>UGX 5,000</div></div><div class="plan" data-plan="1_month" data-amt="15000"><b>1 Month</b><div>UGX 15,000</div></div></div><div class="tabs" id="gateway-tabs"><button class="on" data-g="mtn">MTN MoMo</button><button data-g="airtel">Airtel Money</button><button data-g="card">Card</button><button data-g="voucher">Voucher</button></div><div class="card" id="pay-card"><input id="phone" placeholder="Phone: access number e.g. 0771234567"><input id="payer" placeholder="Payer number (can be friend/family)"><input id="email" placeholder="Email (for card / receipt)"><button class="go" id="pay">Pay with MTN MoMo</button><p id="msg" style="color:#ffb020"></p><p style="color:#8a8a8a;font-size:13px">Free Ads: 3 free ad unlocks per day. <button id="free" style="background:#222;color:#fff;border:1px solid #444;border-radius:8px;padding:8px 12px;cursor:pointer">Use Free Ads</button></p><div id="vbox" style="display:none"><input id="vcode" placeholder="Voucher code e.g. BM-XXXX"><button class="go" id="vre">Redeem Voucher</button></div></div><p><a href="/movies">Back to BureauMovies</a></p></div>
<script>(function(){var plan='1_day',gateway='mtn';var plans=document.getElementById('plans');plans.addEventListener('click',function(e){var p=e.target.closest('.plan');if(!p)return;plans.querySelectorAll('.plan').forEach(function(x){x.classList.remove('on')});p.classList.add('on');plan=p.dataset.plan});var tabs=document.getElementById('gateway-tabs');var vbox=document.getElementById('vbox');var pay=document.getElementById('pay');tabs.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;tabs.querySelectorAll('button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');gateway=b.dataset.g;vbox.style.display=(gateway==='voucher'?'block':'none');pay.style.display=(gateway==='voucher'?'none':'block');pay.textContent='Pay with '+(gateway==='mtn'?'MTN MoMo':gateway==='airtel'?'Airtel Money':'Card')});pay.addEventListener('click',async function(){var msg=document.getElementById('msg');msg.textContent='Sending prompt...';var r=await fetch('/api/movie-subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plan:plan,gateway:gateway,accessPhone:document.getElementById('phone').value,payerPhone:document.getElementById('payer').value||document.getElementById('phone').value,email:document.getElementById('email').value})});var j=await r.json();msg.textContent=j.message||(j.success?'Check your phone.':'Failed');if(j.referenceId){var n=new URLSearchParams(location.search).get('next')||'/movies';setTimeout(function(){location.href=n},2500)}});document.getElementById('vre').addEventListener('click',async function(){var msg=document.getElementById('msg');var r=await fetch('/api/movie-vouchers/redeem',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.getElementById('vcode').value,phone:document.getElementById('phone').value,email:document.getElementById('email').value})});var j=await r.json();msg.textContent=j.message||(j.access?'Voucher active.':'Failed')});document.getElementById('free').addEventListener('click',async function(){var msg=document.getElementById('msg');var r=await fetch('/api/movie-ad-unlock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:document.getElementById('phone').value,email:document.getElementById('email').value})});var j=await r.json();msg.textContent=j.message||'Done'})})();</script></body></html>
