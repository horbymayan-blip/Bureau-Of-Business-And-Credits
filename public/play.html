<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BureauMovies Player</title><link rel="stylesheet" href="/bureau-theme.css"><script src="/bureau-theme.js" defer></script><style>body{margin:0;background:#000;color:#fff;font-family:Inter,system-ui,Arial}video{width:100%;max-height:70vh;background:#000}.w{max-width:900px;margin:0 auto;padding:18px}</style></head><body><div class="w"><a href="/movies" style="color:#fff">Back</a><h2 id="t">Loading...</h2><video id="v" controls playsinline></video><p id="m" style="color:#ffb020"></p></div><!-- access: 'premium' gate: premium titles require api/movie-access --><script>(function(){var id=new URLSearchParams(location.search).get('mId');async function boot(){var acc=await (await fetch('/api/movie-access',{credentials:'same-origin'})).json();var r=await fetch('/api/movies/'+encodeURIComponent(id));var j=await r.json();var movie=j.movie||{};document.getElementById('t').textContent=movie.title||'Untitled';var access=movie.access||'free';if(access==='premium'&&!acc.access){document.getElementById('m').textContent='Premium title - subscribe to watch.';location.href='/premium?next='+encodeURIComponent('/play.html?mId='+id);return}document.getElementById('v').src=movie.mediaUrl||movie.previewUrl||''}boot()})();</script></body></html>
