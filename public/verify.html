<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify account | Bureau Portal</title><style>body{font-family:Arial;background:#eef6ff;min-height:100vh;display:grid;place-items:center;margin:0;padding:20px}main{background:#fff;padding:28px;max-width:420px;width:100%;border:1px solid #dbeafe;border-radius:12px}label{display:block;font-weight:700;margin:16px 0 6px}input,button{width:100%;box-sizing:border-box;padding:12px;font:inherit;border:1px solid #bfdbfe;border-radius:7px}button{margin-top:18px;background:#0d47a1;color:#fff;font-weight:700}#message{min-height:24px}</style></head><body><main><img src="/assets/Bureau%20logo.png" alt="Bureau logo" width="56" style="display:block;margin-bottom:14px"><h1>Verify your account</h1><p>Enter the verification token sent to your email or phone.</p><form id="form"><label for="token">Verification token</label><input id="token" required><button>Verify account</button></form><p id="message" role="status"></p><a href="/account.html">Go to sign in</a></main><script>form.addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/auth/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token.value.trim()})});const x=await r.json();message.textContent=x.message||'Verification complete.'});</script></main></body></html>
